[project]
name = "calculate_accessibility"
version = "0.1.0"
description = ""
authors = [{ name = "pintergreg", email = "pintergreg@gmail.com" }]
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "pandas>=2.3,<3",
    "geopandas>=1.2,<2",
    "numpy>=2.5",
    "osmnx>=2.1,<3",
    "matplotlib>=3.11,<4",
    "shapely>=2.2,<3",
    "pyyaml>=6.0,<7",
    "pyogrio>=0.13",
    "pyarrow>=26",
    "h3>=4.5",
    "contextily>=1.7,<2",
    "seaborn>=0.13,<0.14",
    "pyvalhalla>=3.9,<4",
    "routingpy>=1.3,<2",
    "scipy>=1.18,<2",
    "scikit-learn>=1.9,<2",
    "folium>=0.20",
    "jenkspy>=0.4,<0.5",
    "mapclassify>=2.11,<3",
    "altair>=6.3",
    "vincent>=0.4,<0.5",
    "structlog>=26.1,<27",
    "tabulate>=0.10.0",
    "branca>=0.8.2,<0.9",
    "python-xz>=0.5.0,<0.6",
    "statsmodels>=0.15",
    "stargazer>=0.0.7",
    "openpyxl>=3.1.5,<4",
    "cmcrameri>=1.10,<2",
    "matplotlib-scalebar>=0.9.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7",
    "pandas-stubs>=2.3,<3",
    "types-geopandas>=1.2,<2",
    "types-shapely>=2.1,<3",
    "types-pyyaml>=6.0,<7",
    "rich>=15",
    "types-networkx>=3.6,<4",
]

[tool.uv]
package = false
default-groups = "all"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

extend-include = ["*.ipynb"]

# Same as Black.
line-length = 88
indent-width = 4

# # Assume Python 3.8
# target-version = "py38"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
